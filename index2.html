<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Heart 💖</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  overflow: hidden;
  text-align: center;
}

h1 {
  margin-top: 60px;
  color: white;
}

#heart {
  position: absolute;
  font-size: 100px;
  cursor: pointer;
  transition: transform 0.2s;
  z-index: 10;
}

#heart:hover {
  transform: scale(1.3);
}

#bucketlist {
  display: none;
  padding: 20px;
  color: white;
}

.list-item {
  font-size: 22px;
  margin: 10px;
}

#final-message {
  display: none;
  font-size: 40px;
  color: gold;
  margin-top: 50px;
  animation: fadeIn 3s ease-in-out forwards;
}

.star {
  position: absolute;
  color: white;
  font-size: 20px;
  opacity: 0.8;
  animation: twinkle 2s infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-50px); }
  100% { transform: translateY(0px); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 0.2; }
}
</style>
</head>
<body>

<h1 id="title">Catch the heart to see what's inside 😉</h1>
<div id="heart">💖</div>

<div id="bucketlist">
  <h1>Our Love Bucket List 💕</h1>
  <div class="list-item"><input type="checkbox" onchange="checkAll()"> Masai Mara 🐘</div>
  <div class="list-item"><input type="checkbox" onchange="checkAll()"> Swiss Alps Road Trip 🚗</div>
  <div class="list-item"><input type="checkbox" onchange="checkAll()"> Paris Trip 🗼</div>
  <div class="list-item"><input type="checkbox" onchange="checkAll()"> Italian Summer 🍝</div>
  <div class="list-item"><input type="checkbox" onchange="checkAll()"> Disneyland Paris 🎢</div>
</div>

<div id="final-message">❤️ I love you forever! ❤️</div>

<audio id="romantic-music" loop autoplay>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
const heart = document.getElementById("heart");
const bucket = document.getElementById("bucketlist");
const title = document.getElementById("title");
const finalMsg = document.getElementById("final-message");
const music = document.getElementById("romantic-music");

// Create twinkling stars
for(let i=0;i<50;i++){
  const star = document.createElement('div');
  star.classList.add('star');
  star.style.left = Math.random()*window.innerWidth+'px';
  star.style.top = Math.random()*window.innerHeight+'px';
  star.style.fontSize = (5 + Math.random()*15)+'px';
  document.body.appendChild(star);
}

function moveHeart() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  heart.style.left = x + "px";
  heart.style.top = y + "px";
}

setInterval(moveHeart, 1500);
moveHeart();

heart.addEventListener("click", () => {
  heart.style.display = "none";
  title.style.display = "none";
  bucket.style.display = "block";
  music.play().catch(e=>console.log('Autoplay prevented, tap anywhere to start music'));
});

function checkAll() {
  const checkboxes = bucket.querySelectorAll('input[type="checkbox"]');
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  if(allChecked){
    bucket.style.display = 'none';
    finalMsg.style.display = 'block';
  }
}
</script>

</body>
</html>
